name: 🚀 Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH Deploy Backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🚀 START BACKEND DEPLOY"

            # 🔥 Load NVM (IMPORTANT)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            node -v
            npm -v

            cd ~/Syara_new_backend || exit 1

            echo "📥 Pull latest code"
            git pull origin main

            echo "📦 Install dependencies"
            npm install

            echo "🔄 Restart backend"

            # ✅ safer restart (handles both cases)
            pm2 restart syara_server || pm2 start src/index.js --name syara_server

            echo "📊 PM2 status"
            pm2 list

            echo "💾 Save PM2 state"
            pm2 save

            echo "✅ BACKEND DEPLOY DONE"